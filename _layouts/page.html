<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<link rel="stylesheet" href="{{ site.baseurl }}/assets/style.css">
</head>
<body>
<main>
<h1>{{ page.title }}</h1>
{% if page.subtitle %}<p class="meta">{{ page.subtitle }}</p>{% endif %}
{{ content }}
<footer>
  {{ site.publisher }} &middot; {{ site.contact_email }}<br>
  <a href="{{ site.baseurl }}/">Privacy policies</a>
</footer>
</main>
</body>
</html>
